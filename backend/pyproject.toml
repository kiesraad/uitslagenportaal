[project]
name = "uitslagenportaal"
version = "0.1.0"
description = "TOML file for backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "colorlog>=6.12.0",
    "django>=6.0.8",
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    "django-prometheus>=2.5.0",
    "django-redis>=7.0.0",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.17.2",
    "granian>=2.8.2",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pyeml-bindings>=1.3.1",
    "pygithub>=2.9.1",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "regex>=2026.9.29",
    "requests>=2.32.5",
    "sentry-sdk>=2.73.0",
    "xsdata>=26.1",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.0", # VS Code attach debugging in Docker
    "ruff>=0.16.3",
    "pytest>=8.4.0",
    "pytest-django>=4.13.0",
    "pytest-playwright>=0.9.0",
    "pytest-playwright-axe>=4.13.0",
    "factory-boy>=3.3.3",
    "fakeredis[lua]>=2.37.0",
    "watchfiles>=1.2.0",
    "django-watchfiles>=1.4.0",
    "opencv-python-headless>=5.1.0.95",
    "numpy>=2.5.5",
]
# Shares the lock with production, so dvc's aiobotocore can hold back boto3/botocore until it allows the new version.
ml = [
    "dvc[s3]>=3.67.1",
    "mlflow>=3.18.0",
    "sentencepiece>=0.2.0",
    "torch>=2.9.0",
    "transformers>=4.57.0",
]
# Only the scraper worker image installs this, to keep Playwright out of the runtime image.
scraper = [
    "playwright>=1.62.0",
]

# CPU-only torch: the CUDA wheels add gigabytes the ml image does not use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mainsite.settings"
python_files = ["test_*.py"]
markers = [
    "playwright: browser test; needs the throwaway stack on :8081",
    "axe: axe-core accessibility scan; run with -m axe",
]
# Three suites live under test_*.py. A bare `pytest` (backend-ci) is unit tests
# only; the Playwright job opts into the other two with -m playwright and -m axe.
addopts = ["-m", "not playwright and not axe"]
