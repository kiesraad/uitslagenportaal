[project]
name = "uitslagenportaal"
version = "0.1.0"
description = "TOML file for backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.8",
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.17.2",
    "psycopg2-binary>=2.9.12",
    "pyeml-bindings>=1.3.0",
    "pygithub>=2.9.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "xsdata>=26.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "pytest>=8.4.0",
    "pytest-django>=4.11.0",
    "factory-boy>=3.3.3",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mainsite.settings"
python_files = ["test_*.py"]
