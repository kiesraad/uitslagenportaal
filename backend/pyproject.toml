[project]
name = "uitslagenportaal"
version = "0.1.0"
description = "TOML file for backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.8",
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    "django-redis>=7.0.0",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.17.2",
    "psycopg2-binary>=2.9.12",
    "pyeml-bindings>=1.3.0",
    "pygithub>=2.9.1",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "requests>=2.32.5",
    "xsdata>=26.1",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.0", # VS Code attach debugging in Docker
    "ruff>=0.16.3",
    "watchdog>=6.0.0",
    "pytest>=8.4.0",
    "pytest-django>=4.13.0",
    "pytest-playwright>=0.9.0",
    "factory-boy>=3.3.3",
    "fakeredis[lua]>=2.37.0",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mainsite.settings"
python_files = ["test_*.py"]
markers = ["playwright: browser test; needs the throwaway stack on :8081"]
# Browser tests need a running stack and an installed Chromium, so a bare
# `pytest` (backend-ci) skips them; the Playwright job opts in with -m playwright.
addopts = ["-m", "not playwright"]
