# Values for the three charts this one bundles, each under its chart's name. Installed
# once per cluster, outside the application chart, the same way Traefik and cert-manager
# are. The differences for a local cluster live in values-local.yaml.
#
# Every chart names its resources after the release unless told otherwise. The
# fullnameOverrides below fix the names, because monitoring-proxy, the Loki data source
# and Alloy's push URL all address services by name.

kube-prometheus-stack:
  # Prometheus, Alertmanager, Grafana, node-exporter and kube-state-metrics.
  #
  # Alertmanager is installed but delivers nowhere: no receiver is configured until a
  # notification channel is settled. Alerts are grouped and visible in its UI, and go no
  # further.
  fullnameOverride: kube-prometheus-stack

  prometheus:
    prometheusSpec:
      # Multiple environment namespaces can share a cluster, so Prometheus has to select
      # objects outside its own release. Left at the chart default it matches only what
      # carries this release's labels, and every ServiceMonitor in the project would be
      # created and then silently never scraped.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false

      # Served under a path so one port-forward to monitoring-proxy reaches every UI.
      # externalUrl is what the Source and Silence links in a notification point at, so
      # it names the proxy rather than a service name that resolves nowhere for a reader.
      routePrefix: /prometheus
      externalUrl: http://localhost:9090/prometheus

      # Time and size both bound retention and whichever trips first wins. The size limit
      # is the one that matters: Prometheus does not stop writing when the volume fills,
      # it crashes, and it does so exactly when something interesting is happening. 40GB
      # against a 50Gi volume leaves the WAL, head chunks and compaction their room.
      retention: 30d
      retentionSize: 40GB

      # Without this the pod falls back to emptyDir and loses every metric on restart,
      # including the restart being investigated. A StatefulSet's volumeClaimTemplates
      # are immutable, so this is sized for both namespaces growing, not for today.
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: 50Gi

      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi

  alertmanager:
    alertmanagerSpec:
      routePrefix: /alertmanager
      externalUrl: http://localhost:9090/alertmanager

      # Silences and the notification log live on disk. Without a volume a restart
      # forgets every silence, including one placed deliberately mid-incident.
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: 5Gi

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

  grafana:
    fullnameOverride: kube-prometheus-stack-grafana

    # Generated by templates/grafana-admin.yaml.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password

    # Grafana builds its asset URLs from its own root, so it has to be told the prefix it
    # is served under. Without both of these every stylesheet and API call escapes the
    # prefix and the page renders unstyled behind the proxy.
    grafana.ini:
      server:
        root_url: http://localhost:9090/grafana
        serve_from_sub_path: true

    # Grafana's own metrics are about 5k series that no rule reads, only the Grafana
    # Overview dashboard, which the chart still ships and which now stays empty.
    serviceMonitor:
      enabled: false

    # The chart provisions Prometheus and Alertmanager and nothing else, so without this
    # Grafana has no way to reach Loki and the logs are unqueryable.
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100

    # Dashboards and the preferences that go with them are worth keeping across restarts.
    persistence:
      enabled: true
      size: 5Gi

    # The volume attaches to one node at a time. A rolling update can start the new pod
    # on another node, where it waits for a volume the old pod never releases.
    deploymentStrategy:
      type: Recreate

    # Grafana container only; the two sidecars are separate containers. Its in-memory
    # search indexes plus Explore and log queries got it OOM-killed at 512Mi.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi

  # A managed control plane exposes none of these components, so their targets are
  # permanently down and their alerts fire forever. That teaches everyone to ignore the
  # alerts long before a real one arrives, which is the failure this whole stack exists
  # to avoid.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  # CoreDNS is run by the cluster provider, so its metrics feed one dashboard and no
  # alert anyone here could act on.
  coreDns:
    enabled: false

  # The managed API server exports about 26k series, of which only these few feed the
  # default rules and the API server dashboard. They stay because an unhealthy control
  # plane explains a deploy or every other alert failing at once, even if only the
  # provider can fix it. The dashboard's workqueue panels stay empty.
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        # One name per line: the escaped line breaks join them without spaces.
        - action: keep
          sourceLabels: [ __name__ ]
          regex: "\
            aggregator_unavailable_apiservice|\
            aggregator_unavailable_apiservice_total|\
            apiserver_client_certificate_expiration_seconds_bucket|\
            apiserver_client_certificate_expiration_seconds_count|\
            apiserver_request_sli_duration_seconds_bucket|\
            apiserver_request_sli_duration_seconds_count|\
            apiserver_request_terminations_total|\
            apiserver_request_total|\
            go_goroutines|\
            kubernetes_build_info|\
            process_cpu_seconds_total|\
            process_resident_memory_bytes|\
            rest_client_requests_total"
        # The chart's default bucket pruning, narrowed to the one latency histogram kept
        # above. The SLO rules read only its 1s, 5s and 30s buckets.
        - action: drop
          sourceLabels: [ __name__, le ]
          regex: apiserver_request_sli_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?

  nodeExporter:
    enabled: true

  kubeStateMetrics:
    enabled: true

  kube-state-metrics:
    fullnameOverride: kube-prometheus-stack-kube-state-metrics
    # The chart sets no requests, which leaves the pod first in line for eviction.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

  prometheusOperator:
    # As for kube-state-metrics: without requests the pod is evicted first.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

  prometheus-node-exporter:
    fullnameOverride: kube-prometheus-stack-prometheus-node-exporter
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

loki:
  # Log aggregation. Alloy ships pod logs here and Grafana queries them; Loki itself has
  # no UI and is not behind monitoring-proxy.
  fullnameOverride: loki

  # SingleBinary mode is deliberate: a microservice deployment is not worth running for
  # four workloads. Chunks live in Scaleway object storage, in a bucket of their own
  # rather than the application's, because the retention policy differs and log chunks
  # should not share a bucket with election documents.
  deploymentMode: SingleBinary

  loki:
    # Single-tenant: nothing here multiplexes customers, and enabling auth would mean
    # every query and push carrying a tenant header for no gain.
    auth_enabled: false

    # One ingester, so one copy. The chart defaults this to 3 and single-binary mode does
    # not override it, so leaving it alone means every push is rejected for want of live
    # replicas and Loki stores nothing at all.
    commonConfig:
      replication_factor: 1

    # The bucket and its credentials come from the loki-s3-creds secret through the
    # environment, expanded by -config.expand-env below: the bucket differs per cluster,
    # and inlining the keys here would put a live credential in git.
    storage:
      type: s3
      bucketNames:
        chunks: ${LOKI_S3_BUCKET}
        ruler: ${LOKI_S3_BUCKET}
      s3:
        endpoint: https://s3.nl-ams.scw.cloud
        region: nl-ams
        accessKeyId: ${AWS_ACCESS_KEY_ID}
        secretAccessKey: ${AWS_SECRET_ACCESS_KEY}

    # The schema is append-only: to change it, add a period starting on a future date
    # rather than editing this one, or existing chunks become unreadable.
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # Thirty days, matching the Prometheus retention.
      retention_period: 720h

    # Retention does nothing until the compactor enforces it. Left at the default of
    # false, chunks stay in the bucket forever no matter what retention_period says —
    # the usual way a Loki bill grows quietly.
    compactor:
      retention_enabled: true
      delete_request_store: s3

  singleBinary:
    replicas: 1
    # Loki does not expand environment variables in its config unless told to, and the
    # storage block above is written in terms of them.
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: LOKI_S3_BUCKET
        valueFrom:
          secretKeyRef:
            name: loki-s3-creds
            key: LOKI_S3_BUCKET
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: loki-s3-creds
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-s3-creds
            key: AWS_SECRET_ACCESS_KEY
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

  # SingleBinary runs every component in one process, so the scalable-mode deployments
  # must be held at zero or the chart renders a second, idle copy of each.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  # The memcached tiers are sized for clusters far larger than this one.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Grafana reaches Loki directly over cluster DNS; there is no second entry point to run.
  gateway:
    enabled: false

  # A synthetic log stream used to measure ingestion lag, and the chart's own test pod.
  # Neither earns its keep here.
  lokiCanary:
    enabled: false
  test:
    enabled: false

alloy:
  # Collects pod logs cluster-wide and writes them to Loki, so both application
  # namespaces are covered without the application chart knowing anything about logging.
  #
  # Logs are read through the Kubernetes API rather than from the node filesystem, which
  # keeps this a plain workload with no host mounts.
  fullnameOverride: alloy

  alloy:
    configMap:
      content: |-
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // Only the labels worth querying on are kept. Every other discovery label would
        // become part of the stream's identity, and each distinct combination is a
        // separate stream for Loki to index.
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          // discovery.kubernetes lists every pod in the cluster, and this runs on every
          // node. Without this filter each collector would tail all of them, so the API
          // server serves one read per pod per node and Loki stores as many copies.
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            regex         = sys.env("NODE_NAME")
            action        = "keep"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.app_json.receiver]
        }

        // The backend, Celery (LOG_FORMAT) and the frontend's nginx log JSON with the same
        // keys. Its fields go to structured metadata, where Grafana shows them as fields and
        // table columns without a `| json` in every query, and the line itself becomes the
        // message (plus any traceback).
        loki.process "app_json" {
          forward_to = [loki.write.default.receiver]

          stage.match {
            selector = `{container=~"backend|celery-worker|celery-beat|frontend"}`

            stage.json {
              expressions = {
                message     = "",
                exc_info    = "",
                level       = "levelname",
                logger      = "name",
                process     = "processName",
                method      = "",
                path        = "",
                status      = "",
                duration_ms = "",
                // Celery passes its task lines' fields as `extra={"data": …}`; runtime is in seconds.
                task        = "data.name",
                task_id     = "data.id",
                runtime     = "data.runtime",
              }
            }

            // A line that is not JSON, such as Granian's startup lines, is kept as is. The
            // chart renders this config with Helm's tpl, so the template is a Helm raw string.
            stage.template {
              source   = "line"
              template = {{`"{{ if .message }}{{ .message }}{{ with .exc_info }}\n{{ . }}{{ end }}{{ else }}{{ .Entry }}{{ end }}"`}}
            }

            // Loki derives detected_level from `level`, which Grafana colours lines by.
            stage.structured_metadata {
              values = {
                level       = "",
                logger      = "",
                process     = "",
                method      = "",
                path        = "",
                status      = "",
                duration_ms = "",
                task        = "",
                task_id     = "",
                runtime     = "",
              }
            }

            stage.output {
              source = "line"
            }
          }
        }

        loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }

    # Names the node this collector runs on, which is what the keep rule above filters
    # against.
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

  # One collector per node, each reading only the pods scheduled there.
  controller:
    type: daemonset

  # The chart's own scrape endpoint. Nothing collects it yet, and turning it on would
  # create a ServiceMonitor before there is a reason to read it.
  serviceMonitor:
    enabled: false
