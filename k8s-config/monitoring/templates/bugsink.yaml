apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugsink
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bugsink
  template:
    metadata:
      labels:
        app: bugsink
    spec:
      containers:
        - name: bugsink
          image: bugsink/bugsink:2
          env:
            - name: SITE_TITLE
              value: {{ .Values.bugsink.siteTitle }}
            - name: BASE_URL
              value: {{ .Values.bugsink.baseUrl }}
            - name: USE_X_REAL_IP
              value: "True"
            - name: BEHIND_PLAIN_HTTP_PROXY
              value: "True"
            - name: EMAIL_BACKEND
              value: {{ .Values.bugsink.emailBackend }}
            - name: SINGLE_USER
              value: "True"
            - name: TIME_ZONE
              value: "Europe/Amsterdam"
          envFrom:
            - secretRef:
                name: {{ .Values.bugsink.credsSecret }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # TCP, not httpGet: a restart cannot fix a lost database, and would restart every pod at once.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.bugsink.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: bugsink
  namespace: {{ .Release.Namespace }}
  labels:
    app: bugsink
spec:
  selector:
    app: bugsink
  ports:
    - name: http
      port: 8000
      targetPort: http
