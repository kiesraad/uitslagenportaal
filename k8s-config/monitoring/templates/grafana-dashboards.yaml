{{- /*
Dashboards of our own, one per file in dashboards/. Grafana's dashboard sidecar loads every
ConfigMap with the grafana_dashboard label; editing one in the UI is lost on the next upgrade.
*/}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ base $path | trimSuffix ".json" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
