# Template for the alertmanager-config secret. Copy to alertmanager.yaml (ignored by git),
# fill in the SMTP details and create the secret as described in docs/deployments.md.

global:
  smtp_smarthost: smtp.example.org:587
  smtp_from: alerts@example.org
  smtp_auth_username: alerts@example.org
  smtp_auth_password: change-me

# Only warnings and criticals are mailed. Everything else, such as the chart's
# InfoInhibitor and its info alerts, stays in the UI.
route:
  receiver: "null"
  group_by: [ namespace, alertname ]
  # An alert that keeps firing is mailed again every two days.
  repeat_interval: 48h
  routes:
    - receiver: email
      matchers:
        - severity =~ "warning|critical"

# A critical alert silences the warning of the same name.
inhibit_rules:
  - source_matchers: [ severity = critical ]
    target_matchers: [ severity = warning ]
    equal: [ namespace, alertname ]

receivers:
  - name: "null"
  - name: email
    email_configs:
      - to: team@example.org
        send_resolved: true
