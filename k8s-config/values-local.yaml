# See docs/deployments.md on how to use this for local deployments.

debug: true

app:
  hostname: "uitslagenportaal.localdev"

# Nothing to shield locally, and the credentials secret is not created here.
basicAuth:
  enabled: false

issuer:
  # Let's Encrypt validates by connecting inbound to the hostname, which no
  # local cluster can satisfy; staging relaxes the rate limits, not that.
  type: "selfsigned"

db:
  # The in-cluster Postgres speaks plain TCP, unlike the managed database.
  sslmode: "disable"

redis:
  # The in-cluster Redis speaks plain TCP, unlike the managed cache.
  tls: false

# A local cluster has no prometheus-operator CRDs, and an unknown kind fails the whole
# install rather than being skipped.
monitoring:
  enabled: false

# In-cluster stand-ins for the managed database, cache and object storage.
services:
  enabled: true
  name: "uitslagenportaal"
  username: "uitslagenportaal_user"
  password: "password"
  secretKey: "super-secret"
  postgres:
    image: "postgres:16"
    storage: 2Gi
  redis:
    image: "redis:8"
    storage: 1Gi
  objectStorage:
    image: "rustfs/rustfs:1.0.0-rc.1"
    storage: 5Gi
