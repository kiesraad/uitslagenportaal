# Values for the MLflow chart. Installed in its own namespace, like the monitoring chart. The database host and the
# buckets come from the secrets in docs/deployments.md.

mlflow:
  # Fixes the names of the port-forward in docs/deployments.md and the db-migration init container address.
  fullnameOverride: mlflow

  # The new pod migrates the schema before it starts, and the old pod cannot run against the migrated one.
  strategy:
    type: Recreate

  backendStore:
    # The chart's own migration init container gets neither PGHOST from our secret nor the TLS settings; see
    # initContainers.
    databaseMigration: false
    postgres:
      enabled: true
      # Required by the chart, but overridden by PGHOST from mlflow-db-creds, which comes later in envFrom.
      host: "set-by-mlflow-db-creds"
      port: 5432
      database: mlflow
    # Created outside the chart: see the Secrets section in docs/deployments.md.
    existingDatabaseSecret:
      name: mlflow-db-creds
      usernameKey: PGUSER
      passwordKey: PGPASSWORD

  artifactRoot:
    # --serve-artifacts: clients up- and download through the server, and runs record mlflow-artifacts:/ URIs rather
    # than bucket paths, so the bucket can move without touching the database.
    proxiedArtifactStorage: true
    s3:
      enabled: true
      # Expanded by Kubernetes from mlflow-s3-creds. A missing key stays literal and fails only at the first upload.
      bucket: "$(MLFLOW_S3_BUCKET)"
      path: mlflow

  # Main container only. mlflow-s3-creds also holds the AWS keys boto3 reads.
  extraSecretNamesForEnvFrom:
    - mlflow-db-creds
    - mlflow-s3-creds
  extraEnvVars:
    MLFLOW_S3_ENDPOINT_URL: https://s3.nl-ams.scw.cloud
    AWS_DEFAULT_REGION: nl-ams
    # verify-full would fail: the RDB cert CN is the public endpoint, not the private endpoint dialled here.
    PGSSLMODE: verify-ca
    PGSSLROOTCERT: /etc/mlflow/db/ca.crt
    # Runs only GenAI jobs (judges, prompt optimisation); its runner and queue consumers alone exceed 1Gi.
    MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"

  extraVolumes:
    - name: db-ca
      secret:
        secretName: mlflow-db-creds
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: db-ca
      mountPath: /etc/mlflow/db
      readOnly: true

  # Brings the schema up to the image's MLflow version before the server starts, which refuses an out-of-date one.
  # The same call as the chart's migration container, with the same connection settings as the server.
  initContainers:
    - name: db-migration
      # Keep in step with the chart's appVersion, the image the server runs.
      image: burakince/mlflow:3.16.0
      command: ["python", "-c"]
      args:
        - |
          from mlflow.store.db import utils
          utils._initialize_tables(utils.create_sqlalchemy_engine_with_retry("postgresql://"))
      envFrom:
        - configMapRef:
            name: mlflow-env-configmap
        - secretRef:
            name: mlflow-db-creds
      env:
        - name: PGSSLMODE
          value: verify-ca
        - name: PGSSLROOTCERT
          value: /etc/mlflow/db/ca.crt
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: db-ca
          mountPath: /etc/mlflow/db
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ "ALL" ]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

  # Each worker loads the whole server, about 230 MiB; one is enough for a port-forwarded tool.
  extraArgs:
    workers: "1"

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
