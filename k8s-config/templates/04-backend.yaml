apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-backend-init-job-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
spec:
  # Keep job for an hour
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: {{ .Release.Name }}-backend-migrations
          image: "{{ .Values.backend.image }}"
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          # A data migration that asks a question would otherwise hang here,
          # where there is no terminal to answer it.
          command: [ "python", "manage.py", "migrate", "--no-input" ]
          envFrom:
            {{- include "uitslagenportaal.envFrom" . | nindent 12 }}
          {{- include "uitslagenportaal.dbCaMount" . | nindent 10 }}
      {{- include "uitslagenportaal.dbCaVolume" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      initContainers:
        {{- include "uitslagenportaal.waitForMigrations" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            {{- include "uitslagenportaal.envFrom" . | nindent 12 }}
          env:
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
          # The API exposes no health endpoint, so readiness can only say that
          # granian is accepting connections, not that the database answers.
          readinessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          {{- include "uitslagenportaal.dbCaMount" . | nindent 10 }}
      {{- include "uitslagenportaal.dbCaVolume" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
