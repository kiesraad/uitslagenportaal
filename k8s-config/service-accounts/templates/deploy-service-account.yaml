apiVersion: v1
kind: ServiceAccount
metadata:
  name: uitslagenportaal-deploy
  namespace: {{ .Release.Namespace }}
---
# Full control of the namespace, narrowed to the API groups the application chart
# renders into. RBAC objects are deliberately not among them, so a leaked deploy
# token cannot widen its own grant, which is also why this chart is separate:
# CD authenticates as this account and must not manage its own permissions.
# Namespaces are cluster-scoped and thus out of a Role's reach entirely: the
# namespace is created out of band and CD must not pass --create-namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uitslagenportaal-deploy
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""                           # ConfigMap, Secret, Service; also Helm's release history
      - "apps"                       # Deployment, StatefulSet
      - "batch"                      # the migration and ensure-bucket Jobs
      - "gateway.networking.k8s.io"  # Gateway, HTTPRoute
      - "cert-manager.io"            # Certificate, Issuer
      - "traefik.io"                 # Middleware
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uitslagenportaal-deploy
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: uitslagenportaal-deploy
    # Not defaulted from the release namespace the way metadata is, so it is named here.
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uitslagenportaal-deploy
