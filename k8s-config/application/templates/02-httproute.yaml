{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
      sectionName: websecure
  hostnames:
    - {{ .Values.app.hostname | quote }}
  # Rule order does not decide the winner: the Gateway API matches the longest
  # path prefix first, so /api wins over / wherever it is listed.
  rules:
    # Mirrors the compose proxy: everything Django owns goes to the backend,
    # the rest is the built frontend.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      {{- if .Values.basicAuth.enabled }}
      # The Gateway API has no auth filter of its own; ExtensionRef hands the
      # request to a Traefik middleware instead.
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Release.Name }}-basic-auth
      {{- end }}
      backendRefs:
        - name: {{ .Release.Name }}-backend
          port: {{ .Values.backend.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if .Values.basicAuth.enabled }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ .Release.Name }}-basic-auth
      {{- end }}
      backendRefs:
        - name: {{ .Release.Name }}-frontend
          port: {{ .Values.frontend.port }}
---
# Plain HTTP exists only to be redirected. The ACME challenge still resolves:
# cert-manager's own route matches a longer prefix and so takes precedence.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
      sectionName: web
  hostnames:
    - {{ .Values.app.hostname | quote }}
  rules:
    # No auth here: asking for credentials before the redirect would carry them
    # over plain HTTP.
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- if .Values.basicAuth.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-basic-auth
  namespace: {{ .Release.Namespace }}
spec:
  basicAuth:
    secret: {{ .Values.basicAuth.credSecret }}
    realm: {{ .Values.basicAuth.realm | quote }}
    # Django has no use for the credentials, so they stop at the proxy.
    removeHeader: true
{{- end }}
{{- end }}
