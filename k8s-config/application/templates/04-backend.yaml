apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-backend-init-job-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
spec:
  # Keep job for an hour
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: {{ .Release.Name }}-backend-migrations
          image: "{{ .Values.backend.image }}"
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          # A data migration that asks a question would otherwise hang here,
          # where there is no terminal to answer it.
          command: [ "python", "manage.py", "migrate", "--no-input" ]
          envFrom:
            {{- include "uitslagenportaal.backendEnvFrom" . | nindent 12 }}
          {{- include "uitslagenportaal.caVolumeMounts" . | nindent 10 }}
      {{- include "uitslagenportaal.caVolumes" . | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
      annotations:
        revision: "{{ .Release.Revision }}"
    spec:
      initContainers:
        {{- include "uitslagenportaal.waitForMigrations" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            {{- include "uitslagenportaal.backendEnvFrom" . | nindent 12 }}
          env:
            # The probes below and the metrics scrape both address the pod by its IP,
            # which cannot be listed in ALLOWED_HOSTS ahead of time. settings.py appends
            # this; without it Django answers both with 400 and the pod never starts.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          # /healthz checks the database, so readiness means the pod can actually
          # serve a request.
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # TCP, not /healthz/: a restart cannot fix a lost database, and would restart every pod at once.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          {{- include "uitslagenportaal.caVolumeMounts" . | nindent 10 }}
      {{- include "uitslagenportaal.caVolumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  # A ServiceMonitor matches the Service on its labels
  labels:
    app: {{ .Release.Name }}-backend
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    # Named because a ServiceMonitor names the port it scrapes rather than numbering it.
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
