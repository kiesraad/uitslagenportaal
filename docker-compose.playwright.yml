# Playwright throwaway stack — isolated project name, ports, and services.
#
#   docker compose -f docker-compose.yml -f docker-compose.playwright.yml up

name: uitslagenportaal-playwright

services:
  backend:
    # Dev stack runs under debugpy; Playwright only needs a plain runserver.
    command: python manage.py runserver 0.0.0.0:8000
    ports: !override []
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      S3_PUBLIC_DOMAIN: localhost:19000/uitslagenportaal

  backend-scripts:
    profiles:
      - donotstart

  celery:
    profiles:
      - donotstart

  frontend:
    environment:
      VITE_HMR_CLIENT_PORT: "8081"

  proxy:
    ports: !override
      - "8081:80"

  # Published for the host-side pytest process, which migrates the database, seeds
  # it, and writes EML documents to storage directly (backend/playwright_tests/).
  db:
    ports: !override
      - "5434:5432" # 5433 belongs to the daily stack

  object-storage:
    ports: !override
      - "19000:9000" # matches the backend's S3_PUBLIC_DOMAIN above

  # Nothing on the host talks to the cache; the browser suite never reaches it.
  redis:
    ports: !override []
