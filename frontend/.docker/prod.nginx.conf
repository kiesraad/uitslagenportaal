# This file is included in the http block, so the maps and log format below are allowed here.

# Successful kubelet probes arrive every few seconds; a failing one is exactly what to keep.
map "$status $http_user_agent" $loggable {
  "~^[23]\d\d kube-probe/" 0;
  default 1;
}

map $status $log_level {
  ~^5 ERROR;
  ~^4 WARNING;
  default INFO;
}

# $request_time is seconds with millisecond precision, e.g. 0.003 becomes 3.
map $request_time $request_time_ms {
  "~^0\.0*(\d+)$" $1;
  "~^(\d+)\.(\d{3})$" $1$2;
}

# Same keys as the backend's JSON logs, so Alloy and Grafana treat both alike.
log_format json escape=json
  '{"time":"$time_iso8601","levelname":"$log_level","name":"nginx.access",'
  '"message":"$request_method $request_uri $status ${request_time_ms}ms",'
  '"method":"$request_method","path":"$request_uri","status":$status,"duration_ms":$request_time_ms}';

server {
  listen       80;
  access_log /dev/stdout json if=$loggable;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }
}
