events {}

http {
  server {
    listen 80;

    # When running a Docker command the IPs of containers change and result
    # into a 502 status. Forcing re-resolution per request:
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend  http://backend:8000;
    set $frontend http://frontend:5173;

    # $request_uri keeps the original path and query string, which matches 
    # what these locations forwarded before.
    location /api/ {
      proxy_pass $backend$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
      proxy_pass $backend$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
      proxy_pass $backend$request_uri;
    }

    # Vite dev server, including its HMR websocket.
    location / {
      proxy_pass $frontend$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
