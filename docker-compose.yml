services:
  backend:
    build: ./backend
    # Run Django under debugpy so VS Code can attach ("Django: attach (Docker)").
    command: python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000
    ports:
      - "5678:5678" # debugpy; published to the host for VS Code attach
    environment:
      DB_NAME: uitslagenportaal
      DB_USER: uitslagenportaal_user
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: "5432"
      SECRET_KEY: super-secret
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      DJANGO_SETTINGS_MODULE: "mainsite.settings"
      # The backend uploads over the compose network, but the URLs it hands to
      # the browser have to use the published port instead.
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_PUBLIC_DOMAIN: localhost:9000/uitslagenportaal
      S3_URL_PROTOCOL: "http:"
      S3_BUCKET_NAME: uitslagenportaal
      S3_ACCESS_KEY: uitslagenportaal
      S3_SECRET_KEY: password
      S3_ADDRESSING_STYLE: path
    volumes:
      - ./backend:/app
      - ./backend/.data:/app/.data
    depends_on:
      db:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  # For running one-off scripts/management commands, e.g.:
  #   docker compose run --rm backend-scripts python manage.py <command>
  backend-scripts:
    extends:
      service: backend
    command: sleep infinity
    depends_on: !reset [] # backend-scripts has no service dependencies
    ports: !reset [] # do not inherit 5678 from backend; only backend publishes debugpy

  frontend:
    build: ./frontend
    environment:
      # Empty base URL -> requests go to the same origin the page was loaded
      # from, which the proxy then routes to the backend.
      VITE_API_BASE_URL: ""
      # Lets Vite's HMR websocket reconnect through the proxy's published
      # port instead of the (unpublished) internal dev-server port.
      VITE_HMR_CLIENT_PORT: "8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    volumes:
      - ./.docker/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: uitslagenportaal
      POSTGRES_USER: uitslagenportaal_user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./.docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U uitslagenportaal_user -d uitslagenportaal" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local dev.
  object-storage:
    image: rustfs/rustfs:1.0.0-rc.1
    environment:
      RUSTFS_ACCESS_KEY: uitslagenportaal
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the uitslagenportaal bucket on first run and makes its
  # objects publicly readable, so documents can be served straight from storage
  # without signed URLs. Re-running is a no-op. Uses MinIO's `mc` client, which
  # is also compatible with RustFS's S3 API.
  object-storage-bootstrap:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000 uitslagenportaal password &&
      mc mb --ignore-existing local/uitslagenportaal &&
      mc anonymous set download local/uitslagenportaal
      "
    depends_on:
      object-storage:
        condition: service_healthy
    restart: "no"

volumes:
  db_data:
  rustfs_data:
