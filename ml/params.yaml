jobs: 8
extract_crops:
  # The share of blank crops saved, corrigenda aside; it must leave enough for split.blank.
  blank: 0.2
split:
  train: 0.7
  validate: 0.15
  test: 0.15
  # Blank crops kept, as a share of the written ones; blank means 0 and is easy to tell.
  blank: 0.05
  random-seed: 0
evaluate:
  # Pages of the test split sampled, spread evenly over the models; null for all.
  pages: 300
  random-seed: 0
  # The crops a model needs in the sample to count in the macro scores; it is scored on its own either way.
  macro-min-crops: 200
  # `reader` names the reader in `pv_ocr.readers.READERS`; the rest are its options.
  readers:
    trocr-base:
      reader: trocr
      checkpoint: microsoft/trocr-base-handwritten
    trocr-small:
      reader: trocr
      checkpoint: microsoft/trocr-small-handwritten
