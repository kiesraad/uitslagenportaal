name: Backend CI

on:
  # Workflow only runs on pull_requests and is run from branch-ci-cd.yml
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_NAME: uitslagenportaal
  DB_USER: uitslagenportaal_user
  DB_PASSWORD: password
  DB_HOST: localhost
  DB_PORT: "5432"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"
      - run: uv sync
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uitslagenportaal
          POSTGRES_USER: uitslagenportaal_user
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U uitslagenportaal_user -d uitslagenportaal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"
      - run: uv sync
        working-directory: backend
      - run: uv run python manage.py migrate
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  migrations-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uitslagenportaal
          POSTGRES_USER: uitslagenportaal_user
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U uitslagenportaal_user -d uitslagenportaal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          # lintmigrations resolves the base ref to work out which migrations are new.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"
      - run: uv sync
        working-directory: backend
      - run: uv run python manage.py makemigrations --check --dry-run
        working-directory: backend
      # We use rolling deploys, so both old and new code must cope with the new schema. Only migrations
      # added since dev are linted; the older ones predate the rule.
      - run: uv run python manage.py lintmigrations --git-commit-id origin/dev
        working-directory: backend

  # Runs the base branch's tests against a database migrated by this branch — the state
  # a rolling update passes through, and the one a --rollback-on-failure rollback leaves
  # behind. Label a PR skip-migration-compat when a deliberate two-step migration breaks it.
  migration-compat:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'skip-migration-compat')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uitslagenportaal
          POSTGRES_USER: uitslagenportaal_user
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U uitslagenportaal_user -d uitslagenportaal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"
      - run: uv sync
        working-directory: backend

      # pytest-django prefixes the test database with test_, so migrating that name is
      # what lets --reuse-db pick the schema up below instead of rebuilding it.
      - name: Migrate the test database with this branch
        working-directory: backend
        env:
          DB_NAME: test_uitslagenportaal
        run: |
          PGPASSWORD=password createdb -h localhost -U uitslagenportaal_user test_uitslagenportaal
          uv run python manage.py migrate

      - name: Roll the code back to the base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }} -- backend
          uv sync --directory backend

      - name: Run the base branch's tests against the new schema
        working-directory: backend
        run: uv run pytest --reuse-db
