# Workflow for pushes to main branches/tags, references the backend/frontend CI pipelines which run only for PRs.
name: Main branches CI/CD
on:
  push:
    branches:
      - dev
      - main
    tags:
      - "*"

permissions:
  contents: read

# No workflow-level concurrency on purpose: cancellation is managed per job/called workflow.

jobs:
  # Every suite runs in full before anything is published: path filters apply to a
  # workflow's own triggers, not to a call, and both images are published every run.
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml
  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml
  playwright:
    name: Playwright
    uses: ./.github/workflows/playwright.yml
  helm-ci:
    name: Helm CI
    uses: ./.github/workflows/helm-ci.yml

  frontend-docker-image:
    name: Publish Frontend Image
    needs: [backend-ci, frontend-ci, playwright, helm-ci]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      context: frontend
      image-name: uitslagenportaal-frontend

  backend-docker-image:
    name: Publish Backend Image
    needs: [backend-ci, frontend-ci, playwright, helm-ci]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      context: backend
      image-name: uitslagenportaal-backend

  deploy-dev:
    name: Deploy to scaleway-dev
    if: github.ref == 'refs/heads/dev'
    needs: [frontend-docker-image, backend-docker-image]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: scaleway-dev
      namespace: uitslagenportaal-dev
      values-file: k8s-config/application/values-dev.yaml
      backend-image: ghcr.io/${{ github.repository_owner }}/uitslagenportaal-backend@${{ needs.backend-docker-image.outputs.digest }}
      frontend-image: ghcr.io/${{ github.repository_owner }}/uitslagenportaal-frontend@${{ needs.frontend-docker-image.outputs.digest }}

  deploy-staging:
    name: Deploy to scaleway-staging
    if: github.ref == 'refs/heads/main'
    needs: [ frontend-docker-image, backend-docker-image ]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: scaleway-staging
      namespace: uitslagenportaal-staging
      values-file: k8s-config/application/values-staging.yaml
      backend-image: ghcr.io/${{ github.repository_owner }}/uitslagenportaal-backend@${{ needs.backend-docker-image.outputs.digest }}
      frontend-image: ghcr.io/${{ github.repository_owner }}/uitslagenportaal-frontend@${{ needs.frontend-docker-image.outputs.digest }}
