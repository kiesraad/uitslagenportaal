name: Publish Docker Images
on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
        description: Directory to build the image from
      image-name:
        required: true
        type: string
        description: Name of the image to build
    outputs:
      digest:
        description: Digest of the pushed image, so a caller can deploy this exact build
        value: ${{ jobs.docker-build-push.outputs.digest }}

concurrency:
  # Keyed on the image as well as the ref: the two images publish in parallel from the
  # same caller and must not queue behind each other.
  group: publish-${{ inputs.image-name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Image name with the registry/owner prefix.
  FULL_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch all reachable commits while fetching trees and blobs on-demand.
          # This gives us access to tags but doesn't download the whole history.
          fetch-depth: 0
          filter: tree:0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # A build for refs/tags/v* will be tagged with the version and `prod`.
      # A build for refs/heads/[dev|main] will be tagged with the branch name.
      # `latest` tags are disabled. See also https://github.com/docker/metadata-action#semver
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      # Build and push the image
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/prod.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Cache build artefacts in a dedicated tag
          cache-from: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:buildcache,mode=max

      # This step generates an artefact attestation for the image,
      # which is an unforgeable statement about where and how it was built.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.FULL_IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Remove old images
        # GHCR lists the children of an attestation index as untagged versions;
        # this action resolves each tag's manifest and spares them. A clean-up that
        # reads only the version list deletes them out from under a live tag.
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          # Package name does not work with registry/owner prefix.
          packages: ${{ inputs.image-name }}
          # The moving :dev tag leaves each deployed digest untagged, so keep as many
          # as Helm keeps revisions to roll back to.
          keep-n-untagged: 10
          # Warn if a retained index has a child missing from the registry.
          validate: true
