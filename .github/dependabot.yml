version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # 1st and 15th day of each month
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    # 1st and 15th day of each month
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
      timezone: "Europe/Amsterdam"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns: ["*"]
        update-types:
          - "major"
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "uv"
    directory: "/backend"
    # 1st and 15th day of each month
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    # Order matters: Dependabot puts a dependency in the first group it matches.
    groups:
      uv-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      django:
        patterns:
          - "django"
          - "django-*"
          - "djangorestframework"
          - "djangorestframework-*"
          - "asgiref"
          - "sqlparse"
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
          - "jmespath"
      eml:
        patterns:
          - "pyeml-bindings"
          - "xsdata"
      requests-stack:
        patterns:
          - "requests"
          - "urllib3"
          - "certifi"
          - "idna"
          - "charset-normalizer"
      dev-tooling:
        dependency-type: "development"
        patterns: ["*"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
